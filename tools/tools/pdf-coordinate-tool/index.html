<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Coordinate Tool</title>
  <!-- PDF.js の読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; background: #f0f2f5; }
    #sidebar { width: 360px; background: #fff; border-right: 1px solid #ccc; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    #main { flex: 1; overflow: auto; padding: 20px; position: relative; }
    #canvas-container { position: relative; display: inline-block; border: 1px solid #999; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    canvas { display: block; cursor: crosshair; }
    .marker { position: absolute; width: 8px; height: 8px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    textarea { width: 100%; height: 250px; font-family: monospace; font-size: 12px; }
    input, button, select { padding: 8px; font-size: 14px; }
    button { cursor: pointer; background: #0066cc; color: #fff; border: none; border-radius: 4px; }
    button:hover { background: #0052a3; }
    .field-row { display: flex; gap: 5px; align-items: center; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>PDF 座標取得ツール</h2>
    
    <label>📂 テンプレート選択:</label>
    <select id="template-select">
      <option value="">-- 選択してください --</option>
      <option value="/templates/form5.pdf">様式第5号 (form5.pdf)</option>
      <option value="/templates/form6.pdf">様式第6号 (form6.pdf)</option>
      <option value="/templates/form7.pdf">様式第7号 (form7.pdf)</option>
      <option value="/templates/form7_2.pdf">様式第7号の2 (form7_2.pdf)</option>
      <option value="/templates/form7_3.pdf">様式第7号の3 (form7_3.pdf)</option>
      <option value="/templates/form7_4.pdf">様式第7号の4 (form7_4.pdf)</option>
      <option value="/templates/form7_5.pdf">様式第7号の5 (form7_5.pdf)</option>
      <option value="/templates/form8.pdf">様式第8号 (form8.pdf)</option>
      <option value="/templates/form16_3.pdf">様式第16号の3 (form16_3.pdf)</option>
      <option value="/templates/form16_4.pdf">様式第16号の4 (form16_4.pdf)</option>
      <option value="/templates/form16_5.pdf">様式第16号の5 (form16_5.pdf)</option>
      <option value="/templates/form16_5_2.pdf">様式第16号の5の2 (form16_5_2.pdf)</option>
      <option value="/templates/form16_5_3.pdf">様式第16号の5の3 (form16_5_3.pdf)</option>
      <option value="/templates/form16_5_4.pdf">様式第16号の5の4 (form16_5_4.pdf)</option>
      <option value="/templates/form16_5_5.pdf">様式第16号の5の5 (form16_5_5.pdf)</option>
      <option value="/templates/form16_6.pdf">様式第16号の6 (form16_6.pdf)</option>
    </select>

    <div style="font-size: 12px; color: #888; text-align: center;">または PCからファイルを選択</div>
    <input type="file" id="pdf-file" accept="application/pdf">
    
    <hr>

    <div class="field-row">
      <label>ページ:</label>
      <button id="prev-page">◀</button>
      <span id="page-num">1</span> / <span id="page-count">1</span>
      <button id="next-page">▶</button>
    </div>

    <hr>

    <div class="field-row">
      <input type="text" id="field-id" placeholder="項目ID (例: worker_name)" style="flex:1;">
    </div>
    
    <div style="font-size: 13px; color: #666;">
      選択座標 (PDF座標系):<br>
      <b>X: <span id="click-x">-</span>, Y: <span id="click-y">-</span></b>
    </div>

    <button id="add-field">項目を配列に追加</button>

    <hr>

    <label>生成されたJSON:</label>
    <textarea id="json-output" readonly></textarea>
    <button id="copy-json">JSONをコピー</button>
  </div>

  <div id="main">
    <div id="canvas-container">
      <canvas id="pdf-canvas"></canvas>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.5;
    let currentCoords = null;
    let fields = [];

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    // ArrayBufferからPDFを読込
    async function loadPdfBuffer(buffer) {
      pdfDoc = await pdfjsLib.getDocument(buffer).promise;
      document.getElementById('page-count').textContent = pdfDoc.numPages;
      pageNum = 1;
      renderPage(pageNum);
    }

    // テンプレート選択から直接読み込み
    document.getElementById('template-select').addEventListener('change', async (e) => {
      const url = e.target.value;
      if (!url) return;
      const res = await fetch(url);
      const buffer = await res.arrayBuffer();
      loadPdfBuffer(buffer);
    });

    // PCからのファイル選択時
    document.getElementById('pdf-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fileReader = new FileReader();
      fileReader.onload = async function() {
        loadPdfBuffer(new Uint8Array(this.result));
      };
      fileReader.readAsArrayBuffer(file);
    });

    // ページ描画
    async function renderPage(num) {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: scale });
      
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const renderContext = { canvasContext: ctx, viewport: viewport };
      await page.render(renderContext).promise;

      document.getElementById('page-num').textContent = num;
      clearMarkers();
    }

    // クリック処理 (Canvas座標 ➔ PDF座標 変換)
    canvas.addEventListener('click', async (e) => {
      if (!pdfDoc) return;

      const rect = canvas.getBoundingClientRect();
      const canvasX = e.clientX - rect.left;
      const canvasY = e.clientY - rect.top;

      // PDFのポイント座標に変換 (左下原点)
      const pdfX = Math.round(canvasX / scale);
      const pdfY = Math.round((canvas.height - canvasY) / scale);

      currentCoords = { x: pdfX, y: pdfY };
      document.getElementById('click-x').textContent = pdfX;
      document.getElementById('click-y').textContent = pdfY;

      setMarker(canvasX, canvasY);
    });

    function setMarker(x, y) {
      clearMarkers();
      const marker = document.createElement('div');
      marker.className = 'marker';
      marker.style.left = `${x}px`;
      marker.style.top = `${y}px`;
      container.appendChild(marker);
    }

    function clearMarkers() {
      document.querySelectorAll('.marker').forEach(m => m.remove());
    }

    // フィールド追加
    document.getElementById('add-field').addEventListener('click', () => {
      const id = document.getElementById('field-id').value.trim();
      if (!id || !currentCoords) {
        alert('項目IDを入力し、PDF上をクリックして座標を選択してください');
        return;
      }

      fields.push({
        id: id,
        page: pageNum,
        x: currentCoords.x,
        y: currentCoords.y,
        fontSize: 10
      });

      updateJsonOutput();
      document.getElementById('field-id').value = '';
    });

    function updateJsonOutput() {
      document.getElementById('json-output').value = JSON.stringify(fields, null, 2);
    }

    // JSONコピー
    document.getElementById('copy-json').addEventListener('click', () => {
      const jsonText = document.getElementById('json-output').value;
      navigator.clipboard.writeText(jsonText);
      alert('JSONをクリップボードにコピーしました！');
    });

    // ページ移動
    document.getElementById('prev-page').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      renderPage(pageNum);
    });
    document.getElementById('next-page').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      renderPage(pageNum);
    });
  </script>
</body>
</html>
